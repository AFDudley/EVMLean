name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - uses: leanprover/lean-action@v1
        with:
          test: false

      - name: Check Keccak-256 vectors
        run: lake build Ethereum.SpongeHash.Keccak256Tests

      - name: Restore the execution-spec-tests fixtures
        uses: actions/cache@v4
        with:
          path: .cache/eest/fixtures-tests-v20.0.2.tar.gz
          key: eest-fixtures-v20.0.2

      - name: Fetch the execution-spec-tests fixtures
        run: scripts/fetch-eest.sh 20.0.2

      - name: Run the fixture conformance tests
        run: lake test -- "$(nproc)" 2> conformance-stderr.txt

      - name: Run the legacy conformance tests (without the performance tests)
        env:
          CONFORM_SUITE: legacy
          CONFORM_SKIP_PERF: "1"
        run: lake test -- "$(nproc)" 2> legacy-conformance-stderr.txt

      - name: Show failing conformance tests
        if: failure()
        run: cat failures_live.txt || true
